[pytest]
# 本机同时装了 PySide6(Qt6.10) 与 PyQt6(Qt6.11)。pytest-qt 默认会先加载 PySide6，
# 其旧版 libQt6Core 之后被项目代码的 PyQt6.QtWidgets 复用 → 缺 Qt_6.11 符号、整套用例
# collection error。项目本身只用 PyQt6，这里把 pytest-qt 的绑定钉到 pyqt6。
qt_api = pyqt6
# 视图/控件测试里 tile_map/geocode/collab 会直连被墙的网络(OSM)→ socket
# 无限挂住整轮。signal 方法抓不到 C 级阻塞(Qt 事件循环 / socket connect)，
# 用 thread 方法才杀得掉。挂起测试会在 30s 被判 fail 而非拖死全量。
timeout = 30
timeout_method = thread
