name: Release Windows

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build, for example v0.52"
        required: true

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify release tag matches app version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          $appVersion = (python -c "from app.config.version import APP_VERSION; print(APP_VERSION)").Trim()
          if ($appVersion -ne $env:RELEASE_TAG) {
            throw "APP_VERSION ($appVersion) must match release tag ($env:RELEASE_TAG)"
          }

      - name: Run release tests
        # Claude Code 2026-07-16 — 用户裁定「仅发布流程跳测试步」(v0.61)。
        # 保留步骤以留测试日志, 但设为不阻断: 2 个预存红(collab 计时 flaky + 架构边界
        # lint, 均非本次改动、不影响 exe)不再挡发布。main 的 CI 合并门照旧严格, 不动。
        continue-on-error: true
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File .\scripts\run_tests_batched.ps1 -IncludePackaging

      - name: Build portable Windows package
        shell: pwsh
        # Claude Code 修改 2026-07-15 — codex 回归指出: release.yml 从未把签名私钥
        # 传给 build_windows.ps1, 该脚本私钥缺失时只警告不报错(这对本地/日常CI
        # 打包烟测是对的, 不该改), 但对"正式发布"来说必须签名, 否则应用端已强制
        # 验签却收到无签名官方包, 内置更新器会拒绝安装自己的新版本。这里通过
        # SPECIMEN_UPDATE_PRIVATE_KEY 注入密钥(来自仓库 Secret), 下一步再硬性校验
        # .sig 确实产出。
        env:
          SPECIMEN_UPDATE_PRIVATE_KEY_CONTENT: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY }}
        run: |
          # Claude Code 2026-07-16 — 用户裁定「临时松开签名门, 发无签名包」(v0.61)。
          # §7 旧: 密钥缺失则 throw 阻断发布(见下方注释)。现: 有密钥→签名; 无密钥→
          # 警告并产出无签名包。⚠️ 应用端一旦内置公钥会拒装无签名包, 这是临时放行,
          # 后续应把 UPDATE_SIGNING_PRIVATE_KEY 配为仓库 Secret 恢复签名。
          # if ([string]::IsNullOrWhiteSpace($env:SPECIMEN_UPDATE_PRIVATE_KEY_CONTENT)) {
          #   throw "Secret UPDATE_SIGNING_PRIVATE_KEY is not configured. A tagged release must be signed ..."
          # }
          if ([string]::IsNullOrWhiteSpace($env:SPECIMEN_UPDATE_PRIVATE_KEY_CONTENT)) {
            Write-Warning "UPDATE_SIGNING_PRIVATE_KEY 未配置 — 产出无签名包(临时放行, 用户 2026-07-16)。"
            powershell -ExecutionPolicy Bypass -File .\scripts\build_windows.ps1
          } else {
            $keyPath = Join-Path $env:RUNNER_TEMP "update_private_key.pem"
            Set-Content -Path $keyPath -Value $env:SPECIMEN_UPDATE_PRIVATE_KEY_CONTENT -NoNewline
            $env:SPECIMEN_UPDATE_PRIVATE_KEY = $keyPath
            powershell -ExecutionPolicy Bypass -File .\scripts\build_windows.ps1
            Remove-Item -Path $keyPath -Force -ErrorAction SilentlyContinue
          }

      - name: Resolve package path
        id: package
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist -Filter 'SpecimenPhotoWorkbench-*-win64.zip' | Select-Object -First 1
          if (-not $zip) { throw 'Windows ZIP was not produced' }
          $sig = "$($zip.FullName).sig"
          # Claude Code 2026-07-16 — 用户裁定「临时松开签名门, 发无签名包」(v0.61)。
          # §7 旧: .sig 缺失则 throw 拒发(见下方注释)。现: 缺失则标记 signed=false,
          # 不阻断; 有 .sig 才输出 sig/signame, 供后续步骤按需附带。
          # if (-not (Test-Path -LiteralPath $sig)) {
          #   throw "Release ZIP was built but not signed (.sig missing) — refusing to publish an unsigned official release."
          # }
          $signed = Test-Path -LiteralPath $sig
          "zip=$($zip.FullName)" >> $env:GITHUB_OUTPUT
          "name=$($zip.Name)" >> $env:GITHUB_OUTPUT
          "signed=$($signed.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          if ($signed) {
            "sig=$sig" >> $env:GITHUB_OUTPUT
            "signame=$($zip.Name).sig" >> $env:GITHUB_OUTPUT
          }

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: ${{ steps.package.outputs.zip }}
          if-no-files-found: error

      - name: Upload signature artifact
        # Claude Code 2026-07-16 — 无签名包时跳过(临时放行 v0.61)。
        if: steps.package.outputs.signed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.signame }}
          path: ${{ steps.package.outputs.sig }}
          if-no-files-found: error

      - name: Create or update GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
          ZIP_PATH: ${{ steps.package.outputs.zip }}
          SIG_PATH: ${{ steps.package.outputs.sig }}
        run: |
          # Claude Code 2026-07-16 — 有签名才附带 .sig; 无签名只发 zip(临时放行 v0.61)。
          $assets = @($env:ZIP_PATH)
          $note = "Automated Windows portable build."
          if (-not [string]::IsNullOrWhiteSpace($env:SIG_PATH)) {
            $assets += $env:SIG_PATH
          } else {
            $note = "Automated Windows portable build (UNSIGNED — 临时放行, 内置更新器可能拒装)."
          }
          if (gh release view $env:RELEASE_TAG 2>$null) {
            gh release upload $env:RELEASE_TAG @assets --clobber
          } else {
            gh release create $env:RELEASE_TAG @assets --title $env:RELEASE_TAG --notes $note
          }
